# Mosquitto MQTT Broker Configuration

# Listener configuration
listener 1883
protocol mqtt

# WebSocket listener (optional)
listener 9001
protocol websockets

# Allow anonymous connections (change for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections -1
max_keepalive 65535

# Message size limit (10MB)
message_size_limit 10485760

# Authentication (uncomment for production)
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Access Control List (uncomment for production)
# acl_file /mosquitto/config/acl
